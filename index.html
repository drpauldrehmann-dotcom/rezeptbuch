function picEmoji(r){ return r.fotos&&r.fotos.length? "" : (EMOJI[r.kategorie]||"🍴"); }
function diffBadge(r){ const c={einfach:"",mittel:"amber",schwer:"red"}[r.schwierigkeit]; return r.schwierigkeit? `<span class="badge ${c}">${esc(r.schwierigkeit)}</span>` : ""; }

S.theme = store.get("theme","auto");

function applyTheme(){ const d = S.theme==="dunkel" || (S.theme==="auto" && mq.matches); document.documentElement.classList.toggle("dark", d); const m=$("#themeColor"); if(m) m.content = d? "#0B0F0E" : "#F5F7F6"; }
mq.addEventListener ? mq.addEventListener("change", applyTheme) : mq.addListener(applyTheme);
function setTheme(t){ S.theme=t; store.set("theme",t); applyTheme(); const sh=document.querySelector(".sheet"); if(sh){ sh.querySelectorAll("[data-t]").forEach(b=>b.classList.toggle("on", b.dataset.t===t)); } render(); }
function themeIcon(){ const d = document.documentElement.classList.contains("dark"); return d? "🌙" : "☀️"; }
function themeSheet(){

// ---------- Schnittstelle ----------
async function api(aktion, daten={}){
  const body = new URLSearchParams({ payload: JSON.stringify(Object.assign({ key: S.key, aktion }, daten)) });
  let res;
  try { res = await fetch(API, { method:"POST", body }); } catch(e){ throw new Error("Keine Verbindung zum Server."); }
  const t = await res.text();
  let j; try { j = JSON.parse(t); } catch(e){ throw new Error(t? "Unerwartete Antwort vom Server." : "Leere Antwort – ist der Airtable-Zugang in n8n eingerichtet?"); }
  if(!j.ok) throw new Error(j.fehler || "Fehler");
  return j;
}
async function laden(still=false){
  if(!S.key) return;
  S.laden = true; if(!still) render();
  try {
    const j = await api("liste");
    S.rezepte = j.rezepte || []; S.fehler = "";
    store.set("rezepte", S.rezepte);
  } catch(e){ S.fehler = e.message; if(!still) toast(e.message, 4000); }
  S.laden = false; render();
}
async function speichern(records){
  const vorher = JSON.stringify(S.rezepte);
  for(const r of records){ const x=byId(r.id); if(!x) continue;
    if("Favorit" in r.fields) x.favorit=!!r.fields["Favorit"];
    if("Geplant" in r.fields) x.geplant=r.fields["Geplant"];
    if("Geplante Portionen" in r.fields) x.geplantPortionen=r.fields["Geplante Portionen"];
    if("Zuletzt gekocht" in r.fields) x.zuletzt=r.fields["Zuletzt gekocht"]; }
  store.set("rezepte", S.rezepte); render();
  try { await api("speichern", { records }); }
  catch(e){ S.rezepte = JSON.parse(vorher); store.set("rezepte", S.rezepte); render(); toast("Nicht gespeichert: "+e.message, 4000); }
}

// ---------- Router ----------
function route(){ const h=(location.hash||"#/entdecken").slice(2).split("/"); return { v:h[0]||"entdecken", id:h[1]||"" }; }
function go(h){ S.fresh = true; location.hash = h; }
function goTab(k){
  const v = route().v; const fam = ["entdecken","rezept","zufall","bearbeiten"];
  if(k==="entdecken"){ if(fam.includes(v)) go("#/entdecken"); else { S.fresh=false; location.hash = S.lastRez || "#/entdecken"; } }
  else { S.fresh=false; location.hash = "#/"+k; }
}
let posTimer=null;
window.addEventListener("scroll", () => { const h=location.hash||"#/entdecken"; clearTimeout(posTimer); posTimer=setTimeout(()=>{ S.pos[h]=window.scrollY; }, 80); }, {passive:true});
window.addEventListener("hashchange", () => {
  const h=location.hash||"#/entdecken"; const frisch=S.fresh; S.fresh=false;
  render();
  const y = (!frisch || h==="#/entdecken") ? (S.pos[h]||0) : 0;
  window.scrollTo(0, y); requestAnimationFrame(()=>window.scrollTo(0, y));
});
document.addEventListener("visibilitychange", () => { if(document.visibilityState==="visible" && S.key) laden(true); });

const IC = {"entdecken": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 11h18\"/><path d=\"M5 11a7 7 0 0 0 14 0\"/><path d=\"M8 7c0-1.5 1-2 1-3.5M12 7c0-1.5 1-2 1-3.5M16 7c0-1.5 1-2 1-3.5\"/><path d=\"M9 21h6\"/></svg>", "plan": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"4.5\" width=\"18\" height=\"16\" rx=\"3.5\"/><path d=\"M3 9.5h18M8 2.5v4M16 2.5v4\"/><path d=\"m9 15 2 2 4-4\"/></svg>", "kuehlschrank": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"5\" y=\"2.5\" width=\"14\" height=\"19\" rx=\"3\"/><path d=\"M5 10h14M8.5 6v1.5M8.5 13v3\"/></svg>", "einkauf": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 8h14l-1.3 11.2a2 2 0 0 1-2 1.8H8.3a2 2 0 0 1-2-1.8z\"/><path d=\"M9 8V6.5a3 3 0 0 1 6 0V8\"/></svg>"};
function tabbar(v){
  const t=[["entdecken",IC.entdecken,"Rezepte"],["plan",IC.plan,"Plan"],["kuehlschrank",IC.kuehlschrank,"Kühlschrank"],["einkauf",IC.einkauf,"Einkauf"]];

  $("#tabbar").innerHTML = t.map(([k,i,l]) => `<button class="${(v===k||((v==="rezept"||v==="zufall"||v==="bearbeiten")&&k==="entdecken"))?"on":""}" onclick="goTab('${k}')"><span class="i">${i}</span>${l}${k==="einkauf"&&n? `<span class="cnt">${n}</span>`:""}</button>`).join("");

function render(){
  const r = route(); if(["entdecken","rezept","zufall","bearbeiten"].includes(r.v)) S.lastRez = location.hash || "#/entdecken"; tabbar(r.v);
  const app = $("#app");
  if(!S.key) return app.innerHTML = vSetup();
  if(r.v!=="kochen" && S.cook){ stopCook(); }
  const views = { bearbeiten:vBearbeiten, zufall:vZufall, entdecken:vEntdecken, rezept:vRezept, plan:vPlan, kuehlschrank:vKuehl, einkauf:vEinkauf, kochen:vKochen };
  app.innerHTML = (views[r.v]||vEntdecken)(r.id);
  if(r.v==="kochen") afterCook();
}

async function setKey(){

// ---------- Entdecken ----------
function gefiltert(){
  const q = S.q.trim().toLowerCase(); const f = S.filter;
  return S.rezepte.filter(r => {
    if(S.kat && r.kategorie!==S.kat) return false;
    if(f.mealprep && !r.mealprep) return false;
    if(f.fav && !r.favorit) return false;
    if(f.schnell && !(r.zeit && r.zeit<=30)) return false;
    if(f.einfach && r.schwierigkeit!=="einfach") return false;
    if(f.haupt && !HAUPT.includes(r.kategorie)) return false;
    if(f.foto && !(r.fotos&&r.fotos.length)) return false;
    if(q){ const hay=(r.name+" "+r.kategorie+" "+r.hauptzutaten.join(" ")+" "+r.zutaten.map(z=>z.z).join(" ")).toLowerCase(); if(!q.split(/\s+/).every(w=>hay.includes(w))) return false; }
    return true;
  });
}
function karte(r){
  return `<button class="card" onclick="go('#/rezept/${r.id}')">
    <div class="pic" style="${picStyle(r)}">${picEmoji(r)}${r.favorit? '<span class="fav">❤️</span>':""}${r.geplant? `<span class="plan badge">${esc(r.geplant==="Mealprep Montag"?"Mealprep":r.geplant)}</span>`:""}</div>
    <div class="body"><div class="title">${esc(r.name)}</div>
    <div class="meta">${[fmtZeit(r.zeit), r.schwierigkeit, r.mealprep?"🥡":""].filter(Boolean).join(" · ")}</div></div></button>`;
}
function vEntdecken(){
  const kats = [...new Set(S.rezepte.map(r=>r.kategorie))].sort((a,b)=>a.localeCompare(b,"de"));
  const liste = gefiltert(); const f=S.filter;
  const ch = (k,l) => `<button class="chip ${f[k]?"on":""}" onclick="tog('${k}')">${l}</button>`;
  const std=new Date().getHours(); const gruss = std<11? "Guten Morgen" : std<17? "Hallo" : "Guten Abend";
  return `<div class="row" style="align-items:flex-start"><div style="flex:1"><div class="hello">${gruss} 👋</div><h1 style="margin-top:2px;font-size:29px">Was kochen wir?</h1></div><div class="row"><button class="icon-btn" title="Darstellung" onclick="themeSheet()">${themeIcon()}</button>${S.laden?'<span class="spin" style="margin:0 13px"></span>':`<button class="icon-btn" title="Aktualisieren" onclick="laden()">↻</button>`}</div></div>
    <button class="surprise" onclick="zfStart()"><div class="big">🎲</div><div><b>Überrasch mich</b><span>Art des Gerichts & Wunschzutaten wählen</span></div></button>
    <input class="search" placeholder="Suchen: Name oder Zutat …" value="${esc(S.q)}" oninput="S.q=this.value;upd()" id="q">

    <div id="liste">${liste.length? `<div class="grid">${liste.map(karte).join("")}</div>` : `<div class="empty">${S.rezepte.length? "Nichts gefunden." : (S.fehler? esc(S.fehler) : "Lade Rezepte …")}</div>`}</div>`;

function upd(){ const l=gefiltert(); $("#liste").innerHTML = l.length? `<div class="grid">${l.map(karte).join("")}</div>` : `<div class="empty">Nichts gefunden.</div>`; }
function filterAktiv(){ return !!(S.q.trim() || S.kat || Object.values(S.filter).some(Boolean)); }
function filterReset(){ S.q=""; S.kat=""; S.filter={}; store.set("filter",{}); render(); }
function tog(k){ S.filter[k]=!S.filter[k]; store.set("filter",S.filter); render(); }
// ---------- Überrasch mich ----------
const ARTEN = [
  ["haupt","🍽️","Hauptgericht", r=>HAUPT.includes(r.kategorie)],
  ["mealprep","🥡","Mealprep", r=>r.mealprep],
  ["fruehstueck","🥞","Frühstück", r=>r.kategorie==="Breakfast"],
  ["suess","🍫","Süßes & Snacks", r=>["Snacks","Desserts","Ninja Creami"].includes(r.kategorie)],
  ["backen","🥖","Backen & Brot", r=>["Backen","Brötchen/Brot"].includes(r.kategorie)],
  ["alles","✨","Egal", r=>true]
];
S.zf = store.get("zf", { art:"haupt", zutaten:[], schnell:false, einfach:false });
S.zf.q=""; S.zfSeen=[]; S.zfAkt=null;
function zfSave(){ store.set("zf", { art:S.zf.art, zutaten:S.zf.zutaten, schnell:S.zf.schnell, einfach:S.zf.einfach }); }
function zfPasst(r, w){ w=w.toLowerCase(); return r.hauptzutaten.some(h=>h.includes(w)) || r.zutaten.some(z=>z.z.toLowerCase().includes(w)); }
function zfPool(){
  const art = ARTEN.find(a=>a[0]===S.zf.art) || ARTEN[5];
  return S.rezepte.filter(r => art[3](r) && (!S.zf.schnell || (r.zeit && r.zeit<=30)) && (!S.zf.einfach || r.schwierigkeit==="einfach"))
    .map(r => { const treffer = S.zf.zutaten.filter(w=>zfPasst(r,w)); return { r, treffer }; })
    .filter(x => !S.zf.zutaten.length || x.treffer.length);
}
function zfZiehen(){
  const pool = zfPool(); if(!pool.length){ S.zfAkt=null; return; }
  let frei = pool.filter(x=>!S.zfSeen.includes(x.r.id));
  if(!frei.length){ S.zfSeen=[]; frei=pool; toast("Alle passenden Gerichte gezeigt – es geht von vorn los."); }
  const best = Math.max(...frei.map(x=>x.treffer.length));
  let top = frei.filter(x=>x.treffer.length===best);
  const frisch = top.filter(x=>tageSeit(x.r.zuletzt)>14); if(frisch.length) top=frisch;
  const gew = top.flatMap(x=> x.r.favorit? [x,x,x] : [x]);
  const pick = gew[Math.floor(Math.random()*gew.length)];
  S.zfSeen.push(pick.r.id); S.zfAkt = pick;
}
function zfStart(){ S.zfSeen=[]; S.zfAkt=null; go("#/zufall"); }
function zfLos(){ zfSave(); S.zfSeen=[]; zfZiehen(); render(); setTimeout(()=>{ const e=$("#zfErg"); if(e) e.scrollIntoView({behavior:"smooth", block:"start"}); }, 50); }
function zfNext(){ zfZiehen(); render(); const e=$("#zfErg"); if(e) e.scrollIntoView({block:"start"}); }
function zfZutatAdd(w){ w=(w||"").trim().toLowerCase(); if(!w || S.zf.zutaten.includes(w)) return; S.zf.zutaten.push(w); S.zf.q=""; S.zfAkt=null; zfSave(); render(); }
function zfZutatWeg(w){ S.zf.zutaten=S.zf.zutaten.filter(x=>x!==w); S.zfAkt=null; zfSave(); render(); }
function zfVorschlaege(){
  const art = ARTEN.find(a=>a[0]===S.zf.art) || ARTEN[5]; const q=S.zf.q.trim().toLowerCase();
  const n={}; S.rezepte.filter(art[3]).forEach(r=>r.hauptzutaten.forEach(h=>n[h]=(n[h]||0)+1));
  const BASIS=["knoblauch","zwiebel","rote zwiebel","limette","zitrone","petersilie","frühlingszwiebel","koriander","ingwer","salz","pfeffer","olivenöl"];
  return Object.keys(n).filter(h=>!S.zf.zutaten.includes(h) && (q? h.includes(q) : !BASIS.includes(h))).sort((a,b)=>n[b]-n[a]).slice(0, q? 12 : 14);
}
function zfTipp(v){ S.zf.q=v; const box=$("#zfSug"); if(box) box.innerHTML = zfSugHtml(); }
function zfSugHtml(){ return zfVorschlaege().map(h=>`<button class="chip" onclick="zfZutatAdd(${esc(JSON.stringify(h))})">＋ ${esc(h)}</button>`).join(""); }
function vZufall(){
  const z=S.zf, pool=zfPool(), a=S.zfAkt;
  const res = a? (()=>{ const r=a.r; return `<div id="zfErg" style="scroll-margin-top:12px">
    <h2>Wie wär's mit …</h2>
    <button class="card" style="width:100%" onclick="go('#/rezept/${r.id}')">
      <div class="pic" style="${picStyle(r)};aspect-ratio:16/10;font-size:64px">${picEmoji(r)}${r.favorit?'<span class="fav">❤️</span>':""}</div>
      <div class="body"><div class="title" style="font-size:19px;-webkit-line-clamp:3">${esc(r.name)}</div>
      <div class="meta" style="font-size:13px">${[esc(r.kategorie), fmtZeit(r.zeit), r.schwierigkeit, r.mealprep?"🥡 Mealprep":""].filter(Boolean).join(" · ")}</div>
      ${a.treffer.length? `<div style="margin-top:8px">${a.treffer.map(t=>`<span class="badge" style="margin-right:4px">✓ ${esc(t)}</span>`).join("")}</div>`:""}
      ${r.zuletzt? `<div class="meta">zuletzt gekocht ${new Date(r.zuletzt).toLocaleDateString("de-DE")}</div>`:""}</div></button>
    <button class="btn primary block" style="margin-top:12px" onclick="zfNext()">🎲 Nächster Vorschlag</button>
    <div class="row" style="margin-top:8px">
      <button class="btn" style="flex:1" onclick="go('#/rezept/${r.id}')">Rezept ansehen</button>
      <button class="btn" style="flex:1" onclick="zfPlanen('${r.id}')">📅 Einplanen</button></div>
    <p class="muted small" style="text-align:center">${S.zfSeen.length} von ${pool.length} passenden Gerichten gezeigt</p></div>`; })()
    : "";
  return `<div class="row"><button class="icon-btn" onclick="go('#/entdecken')">‹</button><h1 style="flex:1;margin-left:6px">Überrasch mich</h1></div>
  <h3>Was soll es sein?</h3>
  <div class="row wrap">${ARTEN.map(([k,i,l])=>`<button class="chip ${z.art===k?"on":""}" onclick="S.zf.art='${k}';S.zfAkt=null;zfSave();render()">${i} ${l}</button>`).join("")}</div>
  <div class="row wrap" style="margin-top:8px"><button class="chip ${z.schnell?"on":""}" onclick="S.zf.schnell=!S.zf.schnell;S.zfAkt=null;zfSave();render()">⏱ ≤ 30 Min.</button><button class="chip ${z.einfach?"on":""}" onclick="S.zf.einfach=!S.zf.einfach;S.zfAkt=null;zfSave();render()">einfach</button></div>
  <h3>Lust auf bestimmte Zutaten? <span class="muted small" style="font-weight:400">(optional)</span></h3>
  ${z.zutaten.length? `<div class="row wrap" style="margin-bottom:8px">${z.zutaten.map(w=>`<button class="chip on" onclick="zfZutatWeg(${esc(JSON.stringify(w))})">${esc(w)} ✕</button>`).join("")}</div>`:""}
  <div class="row"><input class="search" placeholder="z. B. Süßkartoffel, Tofu …" value="${esc(z.q)}" oninput="zfTipp(this.value)" onkeydown="if(event.key==='Enter')zfZutatAdd(this.value)"><button class="btn" onclick="zfZutatAdd($('.search').value)">＋</button></div>
  <div class="row wrap" id="zfSug" style="margin-top:8px">${zfSugHtml()}</div>
  <p class="muted small" style="margin-top:10px">${pool.length? pool.length+" Gerichte passen"+(z.zutaten.length>1? " – die mit den meisten Wunschzutaten zuerst":"")+"." : "Keine Gerichte passen – lass eine Zutat oder einen Filter weg."}</p>
  ${a? "" : `<button class="btn primary block" ${pool.length?"":"disabled"} onclick="zfLos()">🎲 Vorschlag zeigen</button>`}
  ${res}<div style="height:20px"></div>`;
}
function zfPlanen(id){
  const art = S.zf.art; const opts = art==="mealprep"? [["Mealprep Montag","Mealprep Mo"],["Samstag","Samstag"],["Sonntag","Sonntag"]] : [["Samstag","Samstag"],["Sonntag","Sonntag"],["Mealprep Montag","Mealprep Mo"]];
  const d=document.createElement("div"); d.className="sheet"; d.onclick=e=>{ if(e.target===d) d.remove(); };

// ---------- Rezept ----------
function zutatenListe(r, faktor, checkbar=false){
  if(!r.zutaten.length) return `<p class="muted">Keine strukturierten Zutaten – siehe Originaltext unten.</p>`;
  let g=null, out="";
  r.zutaten.forEach((z,i) => {
    if((z.g||"")!==g){ g=z.g||""; if(g) out+=`<li class="grp">${esc(g)}</li>`; }
    const amt = z.m==null? "" : fmtAmt(z.m*faktor, z.e);
    out += `<li${checkbar?` onclick="this.classList.toggle('done')" style="cursor:pointer"`:""}><span class="amt">${esc(amt)}</span><span>${esc(z.z)}${z.n?` <span class="note">· ${esc(z.n)}</span>`:""}</span></li>`;
  });
  return `<ul class="ing">${out}</ul>`;
}
function vRezept(id){
  const r = byId(id); if(!r) return `<div class="empty">Rezept nicht gefunden.<br><br><button class="btn" onclick="go('#/entdecken')">Zur Übersicht</button></div>`;
  const basis = r.portionen||2; const p = S.portionen[id] || basis; const fak = p/basis;
  const fi = S.foto[id]||0; const f = r.fotos&&r.fotos[fi];

async function fotoHoch(id, input){
  const file = input.files && input.files[0]; if(!file) return;

  } catch(e){ toast("Foto fehlgeschlagen: "+e.message, 4500); }

function verkleinern(file, max, q){
  return new Promise((ok, err) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => { const s = Math.min(1, max/Math.max(img.width, img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); ok(c.toDataURL("image/jpeg", q).split(",")[1]); };
    img.onerror = () => err(new Error("Bild konnte nicht gelesen werden."));
    img.src = url;
  });
}


// ---------- Rezept bearbeiten / neu ----------
const EINHEITEN = ["g","kg","ml","l","EL","TL","Prise","Prisen","Stück","Dose","Dosen","Packung","Packungen","Päckchen","Handvoll","Bund","Schuss","Zweig","Zweige","Scheibe","Scheiben","Blätter","Blatt","Tasse","Tassen","Glas","Becher","Zehe","Zehen","cm","Msp."];
const BRUCH = {"½":0.5,"¼":0.25,"¾":0.75,"⅓":1/3,"⅔":2/3};
function zahlText(m){ if(m==null) return ""; const v=Math.round(m*100)/100; return String(v).replace(".",","); }
function zutatenZuText(zs){
  let g=null; const out=[];
  for(const z of zs){
    if((z.g||"")!==g){ g=z.g||""; if(out.length) out.push(""); if(g) out.push(g+":"); }
    out.push([zahlText(z.m), z.e||"", z.z+(z.n? ", "+z.n : "")].filter(Boolean).join(" ") + (z.v? " *" : ""));
  }
  return out.join("\n");
}
function parseMenge(t){
  t=t.trim(); let m=t.match(/^(\d+)\s*([½¼¾⅓⅔])$/); if(m) return +m[1]+BRUCH[m[2]];
  if(BRUCH[t]!=null) return BRUCH[t];
  m=t.match(/^(\d+)\/(\d+)$/); if(m) return +m[1]/+m[2];
  m=t.match(/^(\d+(?:[.,]\d+)?)(?:\s*[-–]\s*\d+(?:[.,]\d+)?)?$/); if(m) return parseFloat(m[1].replace(",","."));
  return null;
}
function textZuZutaten(text){
  const out=[]; let g="", leer=false;
  for(let line of text.split("\n")){
    line=line.trim(); if(!line){ leer=true; continue; }
    if(/:$/.test(line)){ g=line.slice(0,-1).trim(); leer=false; continue; }
    if(leer){ g=""; leer=false; }
    let v=false; if(/\s*\*$/.test(line)){ v=true; line=line.replace(/\s*\*$/,""); }
    let m=null, e="", rest=line;
    const mm = rest.match(/^((?:\d+\s*[½¼¾⅓⅔])|[½¼¾⅓⅔]|\d+\/\d+|\d+(?:[.,]\d+)?(?:\s*[-–]\s*\d+(?:[.,]\d+)?)?)\s*(.*)$/);
    if(mm){ m=parseMenge(mm[1]); rest=mm[2]; }
    const em = rest.match(/^(\S+)\s+(.+)$/);
    if(em){ const u=EINHEITEN.find(x=>x.toLowerCase()===em[1].toLowerCase().replace(/\.$/, "") || x.toLowerCase()===em[1].toLowerCase()); if(u){ e=u; rest=em[2]; } }
    let z=rest, n="";
    const k=rest.indexOf(","); if(k>0){ z=rest.slice(0,k).trim(); n=rest.slice(k+1).trim(); }
    const o={ m, e, z }; if(n) o.n=n; if(g) o.g=g; if(v) o.v=1;
    if(z) out.push(o);
  }
  return out;
}
function dauerAus(t){
  const m=t.match(/(\d+(?:[.,]\d+)?)(?:\s*(?:-|–|bis)\s*(\d+(?:[.,]\d+)?))?\s*(Sekunden|Sek\.?|Minuten|Min\.?|Stunden|Stunde|Std\.?)/i);
  if(!m) return 0; const v=parseFloat((m[2]||m[1]).replace(",","."));
  const u=m[3].toLowerCase(); return Math.round(v*(u.startsWith("sek")?1:u.startsWith("min")?60:3600));
}

  const r = byId(id); if(!r) return "";

      ${c.i<n-1? `<button class="btn primary" onclick="schritt(1)">Weiter ›</button>` : `<button class="btn green" onclick="fertig('${id}')">✓ Fertig</button>`}
    </div></div>`;

function hlZutaten(html, r){
  const namen = [...new Set(r.zutaten.filter(z=>!z.v).flatMap(z=>{ const w=z.z.split(/[ ,()]+/).filter(Boolean); return [w[0], w[w.length-1]]; }).filter(w=>w && w.length>3 && !/^(oder|und|frische?|gekochte[rn]?)$/i.test(w)))].sort((a,b)=>b.length-a.length);
  if(!namen.length) return html;
  const re = new RegExp("(" + namen.map(n=>n.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|") + ")", "gi");
  return html.replace(re, '<span class="hl">$1</span>');
}

function timerStart(i){

      <div style="flex:1;min-width:0" onclick="go('#/rezept/${r.id}')"><div class="t">${esc(r.name)}</div><div class="muted small">${[fmtZeit(r.zeit), r.schwierigkeit].filter(Boolean).join(" · ")}</div></div>
      <div style="text-align:center"><div class="stepper"><button onclick="pport('${r.id}',-1)">−</button><span>${r.geplantPortionen||r.portionen||2}</span><button onclick="pport('${r.id}',1)">+</button></div><div class="muted small">Port.</div></div>
      <button class="icon-btn" onclick="planen('${r.id}',null)">✕</button></div>`).join("") || `<div class="muted small" style="padding:6px 2px">Noch nichts geplant.</div>`}
    <button class="btn ghost" onclick="S.filter={${k==="Mealprep Montag"?"mealprep:true":"haupt:true"}};S.kat='';store.set('filter',S.filter);go('#/entdecken')">＋ Rezept aussuchen</button></div>`; }).join("")}
  ${geplant.length? `<button class="btn primary block" style="margin-top:22px" onclick="go('#/einkauf')">🛒 Einkaufsliste ansehen</button>`:""}`;
}
function pport(id,d){ const r=byId(id); speichern([{id, fields:{"Geplante Portionen": Math.max(1,(r.geplantPortionen||r.portionen||2)+d)}}]); }
function planLeeren(){ if(!confirm("Wochenplan leeren?")) return; speichern(S.rezepte.filter(r=>r.geplant).map(r=>({id:r.id, fields:{"Geplant":null,"Geplante Portionen":null}}))); S.haken=new Set(); store.set("haken",[]); }
function vorschlag(slot){
  const pool = S.rezepte.filter(r => !r.geplant && r.schritte.length && (slot==="Mealprep Montag"? r.mealprep : HAUPT.includes(r.kategorie)) && tageSeit(r.zuletzt)>21);
  if(!pool.length) return toast("Keine passenden Rezepte gefunden.");
  const gew = pool.flatMap(r => r.favorit? [r,r,r] : [r]);
  const r = gew[Math.floor(Math.random()*gew.length)];
  speichern([{id:r.id, fields:{"Geplant":slot, "Geplante Portionen":r.portionen||2}}]); toast("Vorschlag: "+r.name);
}

// ---------- Kühlschrank ----------
function vKuehl(){
  const zaehl = {}; S.rezepte.forEach(r=>(S.fNurHaupt && !HAUPT.includes(r.kategorie))? null : r.hauptzutaten.forEach(z=>zaehl[z]=(zaehl[z]||0)+1));
  const fq=S.fq.trim().toLowerCase();
  const alle = Object.keys(zaehl).sort((a,b)=> (S.fridge.has(b)-S.fridge.has(a)) || (zaehl[b]-zaehl[a]) || a.localeCompare(b,"de"));
  const sicht = alle.filter(z=>S.fridge.has(z) || !fq || z.includes(fq)).slice(0, fq? 60 : 40);
  const treffer = kuehlTreffer();
  return `<h1>Was ist noch da?</h1>
  <p class="muted" style="margin-top:-4px">Zutaten antippen – passende Rezepte erscheinen unten, sortiert nach „fehlt am wenigsten“.</p>
  <input class="search" placeholder="Zutat suchen, z. B. Brokkoli" value="${esc(S.fq)}" oninput="S.fq=this.value;kuehlChips()" id="fq">
  <div class="row" style="margin:10px 0"><label class="row small"><input type="checkbox" ${S.fNurHaupt?"checked":""} onchange="S.fNurHaupt=this.checked;render()"> nur Hauptgerichte</label><span class="spacer"></span>${S.fridge.size?`<button class="btn ghost small" onclick="S.fridge.clear();store.set('fridge',[]);render()">Auswahl löschen</button>`:""}</div>
  <div class="row wrap" id="fchips">${sicht.map(z=>`<button class="chip ${S.fridge.has(z)?"on":""}" onclick="fTog(${esc(JSON.stringify(z))})">${esc(z)}</button>`).join("")}</div>
  <h2>${S.fridge.size? treffer.length+" passende Rezepte" : "Passende Rezepte"}</h2>
  ${S.fridge.size? (treffer.length? treffer.slice(0,40).map(t=>`<div class="fridge-res" onclick="go('#/rezept/${t.r.id}')"><div class="plan-item" style="border:0;padding:0;margin:0;background:none;flex:1;min-width:0"><div class="pp" style="${picStyle(t.r)}">${picEmoji(t.r)}</div><div style="min-width:0"><div class="t">${esc(t.r.name)}</div><div class="muted small">${t.fehlt.length? "fehlt: "+esc(t.fehlt.slice(0,5).join(", "))+(t.fehlt.length>5?" …":"") : "✓ alles da"}</div></div></div><div class="bar"><div style="width:${Math.round(t.anteil*100)}%"></div></div></div>`).join("") : `<div class="empty">Kein Rezept passt zu dieser Auswahl.</div>`) : `<div class="empty">Wähle oben aus, was im Kühlschrank ist.</div>`}`;
}
function kuehlChips(){ const v=$("#fq").value; S.fq=v; const pos=$("#fq").selectionStart; render(); const i=$("#fq"); i.focus(); i.setSelectionRange(pos,pos); }
function fTog(z){ S.fridge.has(z)? S.fridge.delete(z) : S.fridge.add(z); store.set("fridge",[...S.fridge]); render(); }
function kuehlTreffer(){
  if(!S.fridge.size) return [];
  return S.rezepte.filter(r=>r.hauptzutaten.length && (!S.fNurHaupt || HAUPT.includes(r.kategorie))).map(r=>{
    const da = r.hauptzutaten.filter(z=>S.fridge.has(z)); const fehlt = r.hauptzutaten.filter(z=>!S.fridge.has(z));
    return { r, da, fehlt, anteil: da.length/r.hauptzutaten.length };
  }).filter(t=>t.da.length).sort((a,b)=> a.fehlt.length-b.fehlt.length || b.anteil-a.anteil);
}


// ---------- Einkaufskorb aus Rezept ----------
function korbSheet(id){
  const r=byId(id); const basis=r.portionen||2; const p=S.portionen[id]||basis; const fak=p/basis;
  const items = r.zutaten.map((z,i)=>({ i, z:z.z, e:z.e||"", m: z.m==null? null : z.m*fak, n:z.n, g:z.g, v:!!z.v }));
  const da = new Set(items.filter(x=>x.v).map(x=>x.i));
  const d=document.createElement("div"); d.className="sheet"; d.onclick=e=>{ if(e.target===d) d.remove(); };
  const zeichne = () => {
    const rest = items.length-da.size; let g=null;
    d.innerHTML=`<div class="in"><h2 style="margin:4px 0 2px">Was ist schon da?</h2>
      <p class="muted small" style="margin:0 0 6px">${esc(r.name)} · ${p} Portion${p===1?"":"en"} – hake ab, was ihr zu Hause habt.</p>
      <div class="row" style="margin-bottom:4px"><button class="btn ghost small" style="padding:6px 0" data-a="keins">Nichts da</button><span class="spacer"></span><button class="btn ghost small" style="padding:6px 0" data-a="vorrat">Nur Vorrat da</button></div>
      <div class="panel">${items.map(x=>{ let h=""; if((x.g||"")!==g){ g=x.g||""; if(g) h=`<div class="ing"><div class="grp" style="padding:12px 0 2px">${esc(g)}</div></div>`; }
        return h+`<label class="check ${da.has(x.i)?"done":""}"><input type="checkbox" data-i="${x.i}" ${da.has(x.i)?"checked":""}><div style="flex:1"><div class="lbl">${esc(x.z)}${x.m!=null? " – "+esc(fmtAmt(x.m,x.e)):""}</div>${x.n?`<div class="src">${esc(x.n)}</div>`:""}</div>${da.has(x.i)?'<span class="badge">da</span>':""}</label>`; }).join("")}</div>
      <div style="position:sticky;bottom:calc(-20px - var(--safe-b));background:var(--bg);margin:0 -20px;padding:12px 20px calc(var(--safe-b) + 8px)"><button class="btn primary block" data-a="ok" ${rest?"":"disabled"}>${rest} Zutat${rest===1?"":"en"} in den Korb</button>
      <button class="btn ghost block" data-a="x">Abbrechen</button></div></div>`;
    d.querySelectorAll("[data-i]").forEach(c=>c.onchange=()=>{ const i=+c.dataset.i; da.has(i)? da.delete(i) : da.add(i); const sc=d.querySelector(".in").scrollTop; zeichne(); d.querySelector(".in").scrollTop=sc; });
    d.querySelector('[data-a="keins"]').onclick=()=>{ da.clear(); zeichne(); };
    d.querySelector('[data-a="vorrat"]').onclick=()=>{ da.clear(); items.filter(x=>x.v).forEach(x=>da.add(x.i)); zeichne(); };
    d.querySelector('[data-a="x"]').onclick=()=>d.remove();
    d.querySelector('[data-a="ok"]').onclick=()=>{
      const zut = items.filter(x=>!da.has(x.i)).map(x=>({ z:x.z, e:x.e, m:x.m }));
      S.korb = S.korb.filter(k=>k.id!==id); S.korb.push({ id, name:r.name, portionen:p, zutaten:zut }); store.set("korb", S.korb);
      zut.forEach(z=>S.haken.delete(z.z.trim().toLowerCase()+"|"+(z.e||""))); store.set("haken",[...S.haken]);
      d.remove(); render(); toast(`🛒 ${zut.length} Zutat${zut.length===1?"":"en"} im Einkaufskorb`);
    };
  };
  zeichne(); document.body.appendChild(d);
}
function korbWeg(id){ S.korb=S.korb.filter(k=>k.id!==id); store.set("korb",S.korb); render(); }
// ---------- Einkauf ----------
function einkaufListe(){
  const map = new Map();
  for(const r of S.rezepte.filter(x=>x.geplant)){
    const fak = (r.geplantPortionen||r.portionen||2)/(r.portionen||2);
    for(const z of r.zutaten){
      if(z.v && !S.zeigeVorrat) continue;
      const name = z.z.trim(); const e = z.e||"";
      const key = (name.toLowerCase()+"|"+e);
      const x = map.get(key) || { key, name, e, m:0, unbestimmt:false, quellen:new Set(), vorrat:!!z.v };
      if(z.m==null) x.unbestimmt=true; else x.m += z.m*fak;
      x.quellen.add(r.name); map.set(key, x);
    }
  }
  for(const k of S.korb){
    for(const z of k.zutaten){
      const name = z.z.trim(); const e = z.e||""; const key = (name.toLowerCase()+"|"+e);
      const x = map.get(key) || { key, name, e, m:0, unbestimmt:false, quellen:new Set(), vorrat:false };
      if(z.m==null) x.unbestimmt=true; else x.m += z.m;
      x.quellen.add(k.name); map.set(key, x);
    }
  }
  for(const e of S.extra) map.set("extra|"+e, { key:"extra|"+e, name:e, e:"", m:0, unbestimmt:true, quellen:new Set(["selbst ergänzt"]), extra:true });
  return [...map.values()].sort((a,b)=> (a.vorrat-b.vorrat) || a.name.localeCompare(b.name,"de"));
}
const FEIN=["g","ml","EL","TL","kg","l","Prise","Prisen"];
function artikelText(x){ const m = x.m && !FEIN.includes(x.e)? Math.ceil(x.m-0.05) : x.m; const a = m? fmtAmt(m, x.e) : ""; return x.name + (a? " – "+a : "") + (x.m && x.unbestimmt? " + etwas" : ""); }
function vEinkauf(){
  const l = einkaufListe(); const offen = l.filter(x=>!S.haken.has(x.key));
  const geplant = S.rezepte.filter(r=>r.geplant);
  const quellen = [geplant.length? `${geplant.length} geplanten Rezept${geplant.length===1?"":"en"}` : "", S.korb.length? `${S.korb.length} Rezept${S.korb.length===1?"":"en"} im Korb` : ""].filter(Boolean).join(" und ");
  return `<h1>Einkaufskorb</h1>
  ${quellen? `<p class="muted" style="margin-top:-4px">Aus ${quellen}. Hake ab, was schon da ist – der Rest geht an Microsoft To Do.</p>` : `<div class="empty">Der Korb ist leer.<br>Plane Gerichte im Wochenplan oder tippe in einem Rezept auf „Zutaten in den Einkaufskorb“.<br><br><button class="btn" onclick="go('#/plan')">Zum Wochenplan</button></div>`}
  ${S.korb.length? `<div class="row wrap" style="margin:4px 0 6px">${S.korb.map(k=>`<button class="chip" onclick="korbWeg('${k.id}')">🛒 ${esc(k.name)} · ${k.portionen} P. ✕</button>`).join("")}</div>`:""}
  <div class="row" style="margin:8px 0"><input class="search" id="extraIn" placeholder="Etwas ergänzen, z. B. Hafermilch" onkeydown="if(event.key==='Enter')extraAdd()"><button class="btn" onclick="extraAdd()">＋</button></div>
  <label class="row small muted" style="margin:6px 0 4px"><input type="checkbox" ${S.zeigeVorrat?"checked":""} onchange="S.zeigeVorrat=this.checked;render()"> Vorratszutaten anzeigen (Salz, Öl, Gewürze …)</label>
  <div class="panel" style="margin-top:8px">${l.length? l.map(x=>`<label class="check ${S.haken.has(x.key)?"done":""}"><input type="checkbox" ${S.haken.has(x.key)?"checked":""} onchange="hTog(${esc(JSON.stringify(x.key))})"><div style="flex:1"><div class="lbl">${esc(artikelText(x))}${x.vorrat?' <span class="badge amber">Vorrat</span>':""}</div><div class="src">${esc([...x.quellen].join(", "))}</div></div>${x.extra?`<button class="icon-btn" style="width:32px;height:32px" onclick="event.preventDefault();extraWeg(${esc(JSON.stringify(x.name))})">✕</button>`:""}</label>`).join("") : `<div class="muted">Leer.</div>`}</div>
  ${l.length? `<button class="btn green block" style="margin-top:16px" ${offen.length?"":"disabled"} onclick="senden()" id="sendBtn">An To-Do „Einkaufsliste“ senden (${offen.length})</button>
  <p class="muted small" style="text-align:center">Abgehakt = schon zu Hause. Artikel, die schon offen auf der To-Do-Liste stehen, werden nicht doppelt angelegt.</p>`:""}`;
}
function hTog(k){ S.haken.has(k)? S.haken.delete(k) : S.haken.add(k); store.set("haken",[...S.haken]); render(); }
function extraAdd(){ const v=$("#extraIn").value.trim(); if(!v) return; S.extra.push(v); store.set("extra",S.extra); render(); }
function extraWeg(n){ S.extra=S.extra.filter(x=>x!==n); store.set("extra",S.extra); render(); }
async function senden(){
  const artikel = einkaufListe().filter(x=>!S.haken.has(x.key)).map(artikelText);
  const b=$("#sendBtn"); b.disabled=true; b.innerHTML='<span class="spin"></span> Wird gesendet …';
  try {
    const j = await api("einkauf", { artikel });
    if(j.fehlgeschlagen){ toast(`${j.angelegt} angelegt, ${j.fehlgeschlagen} nicht – bitte nochmal senden.`, 5000); b.disabled=false; b.textContent="Nochmal versuchen"; return; }
    toast(`✓ ${j.angelegt} Artikel in To Do angelegt` + (j.schon_auf_liste&&j.schon_auf_liste.length? `, ${j.schon_auf_liste.length} standen schon drauf` : ""), 4000);
    einkaufListe().forEach(x=>S.haken.add(x.key)); store.set("haken",[...S.haken]); S.extra=[]; store.set("extra",[]); S.korb=[]; store.set("korb",[]); render();
  } catch(e){ toast("Senden fehlgeschlagen: "+e.message, 4500); b.disabled=false; b.textContent="Nochmal versuchen"; }
}

// ---------- Start ----------
render();
if(S.key) laden(S.rezepte.length>0);
</script>
</body>
</html>
